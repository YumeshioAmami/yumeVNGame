name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Generate local placeholder art
        run: python scripts/build_assets.py

      - name: Type-check frontend
        run: npx tsc --noEmit -p web/tsconfig.json

      - name: Build frontend
        run: npm run build

      - name: Validate story packages
        run: python scripts/validate_packages.py

      - name: Start API
        run: |
          python -m uvicorn server.main:app --host 127.0.0.1 --port 8787 &
          sleep 3

      - name: Smoke test
        run: python scripts/smoke_test.py

